[package]
name = "beamscale-desktop-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Machine-local BeamScale control plane"
repository = "https://github.com/beamscale/beamscale-desktop-daemon"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
needless_return = "allow"
