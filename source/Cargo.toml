[package]
name = "ores-forms-web-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only JSON, SSR, and component web server for Ores Forms"
repository = "https://github.com/ores-forms/ores-forms-web-server.rs"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum = "0.8"
next-loggers = { package = "oresoftware-next-loggers", path = "../vendor/next-loggers" }
ores-forms-lib-core = { path = "../vendor/forms-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[lints.rust]
unsafe_code = "forbid"
