name: ores-forms-no-secret-carrier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify exact source and dependency trees
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:source-exact)" = "44da18d75be4e6b20e169f416d893f576ca2367f"
          test "$(git rev-parse HEAD:vendor/ores-forms-lib-core)" = "912f858c21aff2d6029f6feba49d46ff5e254ab1"
          diff -ru --exclude=Cargo.toml source-exact source
          grep -F 'rev = "8a06ba585ee1a1388f3103b5566f3e5a736503d2"' source-exact/Cargo.toml
          grep -F 'ores-forms-lib-core = { path = "../vendor/ores-forms-lib-core" }' source/Cargo.toml
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p ores-forms-web-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p ores-forms-web-server --all-targets
