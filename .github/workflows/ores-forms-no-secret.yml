name: ores-forms-no-secret-carrier

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify exact source and dependency trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:source-exact)" = "caf169f205fa28989dddeacfacf3cffa328818c5"
          test "$(git rev-parse HEAD:vendor/ores-forms-lib-core)" = "912f858c21aff2d6029f6feba49d46ff5e254ab1"
          diff -ru --exclude=Cargo.toml source-exact source
          grep -F 'rev = "8a06ba585ee1a1388f3103b5566f3e5a736503d2"' source-exact/Cargo.toml
          grep -F 'ores-forms-lib-core = { path = "../vendor/ores-forms-lib-core" }' source/Cargo.toml
      - name: Rust toolchain
        run: rustc --version && cargo --version && rustfmt --version && cargo clippy --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p ores-forms-web-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p ores-forms-web-server --all-targets
      - name: JavaScript syntax
        run: node --check source/assets/ores-form.js
