name: Oreslang exact-head mirror validation
on:
  push:
    branches:
      - "feat/oreslang-mirror-pr*"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact reconciled source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:oreslang-src)" = "23162c865ede0ce45b437509f99b5a6d7f5494fe"
          test "$(cat SOURCE_HEAD.txt)" = "9b6652d8e63f5a31b1ee7421c560661fe322bbee"
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Full JVM verification
        working-directory: oreslang-src
        run: mvn -B -ntp verify
      - name: Run core examples
        working-directory: oreslang-src
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
