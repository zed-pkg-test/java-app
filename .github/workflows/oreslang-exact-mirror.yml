name: Oreslang exact-head mirror validation
on:
  push:
    branches:
      - "feat/oreslang-mirror-pr*"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Provenance
        run: |
          test -s SOURCE_HEAD.txt
          printf 'source-head: '; cat SOURCE_HEAD.txt
          java --version
          native-image --version
          mvn --version
      - name: Full JVM verification
        run: mvn -B -ntp verify
      - name: Run core examples
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/aot-jit-declarations.ores"
      - name: Build GraalVM Native Image AOT launcher
        run: mvn -B -ntp -DskipTests -Pnative-aot package
      - name: Run core examples through AOT launcher
        run: |
          test -x target/ores-aot
          ./target/ores-aot examples/showcase.ores
          ./target/ores-aot examples/together.ores
          ./target/ores-aot examples/aot-jit-declarations.ores
      - name: Compare arity-overload semantics across JIT and AOT
        run: |
          expected='base0|base1|base2|static0|static1|base0|child1|base2|static0|static1'
          jit_output="$(mvn -q -DskipTests exec:java -Dexec.args="examples/aot-jit-declarations.ores" 2>/dev/null | grep -F 'base0|' | tail -n 1)"
          aot_output="$(./target/ores-aot examples/aot-jit-declarations.ores 2>/dev/null | grep -F 'base0|' | tail -n 1)"
          printf 'jit: %s\n' "$jit_output"
          printf 'aot: %s\n' "$aot_output"
          test "$jit_output" = "$expected"
          test "$aot_output" = "$expected"
          test "$jit_output" = "$aot_output"
      - name: Build Oreslang AOT native executable
        run: mvn -B -ntp -Pnative-aot -DskipTests package
      - name: Smoke test AOT native executable
        run: |
          test -x target/ores-aot
          ./target/ores-aot -XX:MissingRegistrationReportingMode=Exit --mode=aot --platform=linux examples/together.ores
          ./target/ores-aot -XX:MissingRegistrationReportingMode=Exit --mode=aot --platform=linux examples/showcase.ores
          ./target/ores-aot -XX:MissingRegistrationReportingMode=Exit --mode=aot --platform=linux examples/aot-actor-smoke.ores
