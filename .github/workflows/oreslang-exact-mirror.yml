name: Oreslang PR182 scheduler diagnostic

on:
  push:
    branches:
      - "feat/oreslang-mirror-pr*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source subtree
        run: |
          test "$(git rev-parse HEAD:oreslang-src)" = "f99f6594f3de9f3879c695f97125dc48da0b01c3"
          printf 'source-tree: '
          git rev-parse HEAD:oreslang-src
          java --version
          native-image --version
          mvn --version
      - name: Loop safepoint regression
        run: timeout 75s mvn -B -ntp -Dtest=RoutineAndLoopTest test
      - name: Hot reload cleanup regression
        run: timeout 75s mvn -B -ntp -Dtest=SecureJitHotReloadDomainTest test
