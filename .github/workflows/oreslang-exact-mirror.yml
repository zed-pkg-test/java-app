name: Oreslang PR182 scheduler diagnostic

on:
  push:
    branches:
      - "feat/oreslang-mirror-pr*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source subtree
        run: |
          test "$(git rev-parse HEAD:oreslang-src)" = "01e43e6f52201c65bba29c6c518e16ddce4d68bd"
          printf 'source-tree: '
          git rev-parse HEAD:oreslang-src
          java --version
          native-image --version
          mvn --version
      - name: Core OresScheduler tests
        run: timeout 90s mvn -B -ntp -Dtest=OresSchedulerTest test
      - name: Future callback tests
        run: timeout 90s mvn -B -ntp -Dtest=OresFutureCallbackTest test
      - name: RX scheduler tests
        run: timeout 90s mvn -B -ntp -Dtest=OresObservableTest test
      - name: Source scheduler tests
        run: timeout 90s mvn -B -ntp -Dtest=AsyncSchedulerLanguageTest test
