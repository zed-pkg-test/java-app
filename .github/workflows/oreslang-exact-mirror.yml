name: Oreslang PR182 scheduler diagnostic

on:
  push:
    branches:
      - "feat/oreslang-mirror-pr*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source subtree
        run: |
          test "$(git rev-parse HEAD:oreslang-src)" = "01e43e6f52201c65bba29c6c518e16ddce4d68bd"
          printf 'source-tree: '
          git rev-parse HEAD:oreslang-src
          java --version
          native-image --version
          mvn --version
      - name: Actor runtime isolation tests
        continue-on-error: true
        run: timeout 75s mvn -B -ntp -Dtest=ActorRuntimeTest,PrivateActorIsolationTest,SharedPrivateActorIsolationProofTest test
      - name: Actor language tests
        continue-on-error: true
        run: timeout 75s mvn -B -ntp -Dtest=ActorCallableKeywordTest,ActorSpawnLanguageTest test
      - name: Future and lock language tests
        continue-on-error: true
        run: timeout 75s mvn -B -ntp -Dtest=FutureLanguageTest,RwLockLanguageTest,MutexLanguageTest test
      - name: Mutex runtime tests
        continue-on-error: true
        run: timeout 75s mvn -B -ntp -Dtest=MutexRuntimeTest test
      - name: Hot reload and linked runner tests
        continue-on-error: true
        run: timeout 75s mvn -B -ntp -Dtest=SecureJitHotReloadDomainTest,LinkedProgramRunnerTest test
