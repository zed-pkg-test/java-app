name: client capability drift

on:
  pull_request:
    paths:
      - ".github/workflows/capability-drift.yml"
      - "README.md"
      - "scripts/check-client-capability-drift.py"
      - "clients/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/capability-drift.yml"
      - "README.md"
      - "scripts/check-client-capability-drift.py"
      - "clients/**"
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: client-capability-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documented-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Compare README capability claims with reviewed SDK code
        run: python3 scripts/check-client-capability-drift.py
