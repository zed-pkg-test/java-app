name: Oreslang PR550 ownership-call-loan JVM admission
on:
  push:
    branches: [test/ownership-call-loans-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ownership-jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify 70 exact JVM source Git hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < mirror/oreslang-pr550-blobs.txt)" -eq 70
          while read -r expected filename; do
            actual="$(git hash-object "$filename")"
            if [ "$expected" != "$actual" ]; then
              echo "Git source mismatch: $filename" >&2
              exit 1
            fi
          done < mirror/oreslang-pr550-blobs.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile JVM compiler and run ownership regression suite
        run: mvn -B -ntp -f mirror/oreslang/pom.xml -P '!native-thread-unix' -Dores.runtime.carriers=java -Dtest=PointerlessFncOwnershipTest,OwnershipAndClosureTest,DeferredChannelOwnershipHardeningTest,SelectBorrowLifetimeTest,FormalOwnershipDomainModelCheckTest test
