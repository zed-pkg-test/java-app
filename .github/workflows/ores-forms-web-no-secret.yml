name: ores-forms-web-no-secret

on:
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.88.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Verify exact mirrored trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:source-exact)" = "73ee06664411cf83afc348180602ee3ecbe3dce6"
          test "$(git rev-parse HEAD:vendor/ores-forms-lib-core)" = "912f858c21aff2d6029f6feba49d46ff5e254ab1"
          diff -ru --exclude=Cargo.toml source-exact source-test
          grep -F 'ores-forms-lib-core = { git = "https://github.com/ores-forms/ores-forms-lib-core.git", rev = "8a06ba585ee1a1388f3103b5566f3e5a736503d2" }' source-exact/Cargo.toml
          grep -F 'ores-forms-lib-core = { path = "../vendor/ores-forms-lib-core" }' source-test/Cargo.toml

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Format source package
        run: cargo fmt --manifest-path source-test/Cargo.toml --package ores-forms-web-server -- --check

      - name: Clippy
        run: cd source-test && cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cd source-test && cargo test --all-targets

      - name: Shared template contract
        run: cargo test --manifest-path source-test/template-shared/Cargo.toml

      - name: JavaScript syntax
        run: node --check source-test/assets/ores-form.js
