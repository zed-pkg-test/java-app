name: oreslang pr45 generics verify

on:
  push:
    branches:
      - "ci/oreslang-pr45-generics-20261002"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - name: Check out mirrored Oreslang snapshot
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'

      - name: Diagnostics
        run: |
          echo "Pinned source: ec30306dc9709a997ba3e3f74e3f643cae87a294"
          java --version
          mvn --version

      - name: Focused generics and operators tests
        run: mvn -B -ntp -Dtest=GenericsAndOperatorsHardeningTest test

      - name: Full compiler and runtime verification
        run: mvn -B -ntp verify

      - name: Run showcase
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"

      - name: Run together example
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
