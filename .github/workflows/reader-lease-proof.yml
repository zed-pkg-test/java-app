name: reactive reader lease exact-tree proof
on:
  push:
    branches: ["proof/reader-lease-hardening-20261008"]
permissions:
  contents: read
concurrency:
  group: rx-reader-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reactive-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39f091067756aa8503d1d67b5c71ca9aa19b74e2
          persist-credentials: false
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          cache: maven
      - name: Assert exact upstream source tree
        run: test "$(git rev-parse 'HEAD^{tree}')" = 291d9f6e1da8215304b1de7e0f8781d2800c7782
      - name: Compile and execute focused lock/lifecycle regression suite
        run: mvn -B -ntp -Dtest=ReactiveReaderLeaseTest,ReactiveReaderLanguageTest,ActorStreamLifecycleTest,ActorSpawnStreamContractTest,LinkedProgramRunnerTest clean test
      - name: Repeat lifecycle and reader regression tests
        run: |
          for iteration in $(seq 1 12); do
            echo "reader regression iteration $iteration"
            mvn -B -ntp -Dtest=ReactiveReaderLeaseTest,ReactiveReaderLanguageTest,ActorStreamLifecycleTest,ActorSpawnStreamContractTest,LinkedProgramRunnerTest test
          done
