name: oreslang-http-routing-hardened-proof

on:
  push:
    branches:
      - proof/oreslang-http-routing-hardened-ec2ba5f-20261005

permissions:
  contents: read

jobs:
  exact-tree-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out mirrored proof tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < proof/ROUTING_COMMIT)" = "ec2ba5f9fe42585d215f4d7e3174af2290e88a55"
          test "$(tr -d '[:space:]' < proof/COMPILER_COMMIT)" = "ee19932f130204875c61d3e985a52aeba0e67c2b"
          test "$(tr -d '[:space:]' < proof/routing/SOURCE_REF)" = "ee19932f130204875c61d3e985a52aeba0e67c2b"
          test "$(git rev-parse HEAD:proof/routing)" = "b97d6b0d8576a233eb21a116ecb398eda946c91a"
          test "$(git hash-object proof/routing/src/http_routing.ores)" = "e790f27aef4574b3454c7b936c893eff1b5996ce"
          test "$(git hash-object proof/routing/scripts/audit.sh)" = "f10ed1d29778951669bfa32a5fe53db834b84825"
          test "$(git hash-object proof/routing/tests/router_semantics.ores)" = "63b97e4b5f1c05b9c2498520598f68572b3faa97"
          test "$(git hash-object proof/routing/tests/expected.txt)" = "d6420d53b93655fde91a8b62e1c9bd7f58ef1523"
          test "$(git hash-object proof/compiler/src/main/java/dev/oreslang/parser/Parser.java)" = "38f27353cccdd2065d043c1c8c9445903c221052"

      - name: Install Java 21 and Maven
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openjdk-21-jdk maven
          /usr/lib/jvm/java-21-openjdk-amd64/bin/java -version
          JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 mvn -version

      - name: Verify exact Oreslang compiler
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f proof/compiler/pom.xml verify

      - name: Run exact routing audit and golden semantics
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          cat > "$RUNNER_TEMP/oreslang-compiler" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${COMPILER_POM:?COMPILER_POM must be set}"
          exec mvn -B -ntp -q -f "$COMPILER_POM" -DskipTests exec:java -Dexec.args="$*"
          SH
          chmod +x "$RUNNER_TEMP/oreslang-compiler"
          export COMPILER_POM="$GITHUB_WORKSPACE/proof/compiler/pom.xml"
          export ORESLANG_COMPILER="$RUNNER_TEMP/oreslang-compiler"
          bash proof/routing/scripts/test.sh
