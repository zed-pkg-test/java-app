name: Beamscale PR108 exact-tree validation

on:
  pull_request:
    branches: [main]
    paths:
      - "_ci/beamscale-pr108/**"
      - ".github/workflows/beamscale-pr108-exact.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: _ci/beamscale-pr108

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prove exact private-source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:_ci/beamscale-pr108)" = "5d923882c2e02f276cb76ebbc175304cb5c36a33"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "_ci/beamscale-pr108 -> target"
      - name: Verify Rust candidate
        shell: bash
        run: |
          set -o pipefail
          cargo +1.90.0 fmt --all -- --check
          cargo +1.90.0 clippy --locked --all-targets --all-features -- -D warnings
          cargo +1.90.0 test --locked --all-targets
          git diff --exit-code -- Cargo.lock
