name: ores-orm-main-baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - run: test "$(git rev-parse HEAD:source-main)" = "ebe8340f8891f0de3671df0dfe2c7f1eede11417"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Normalize formatting in diagnostic copy
        run: cd source-main && cargo fmt --all
      - run: cd source-main && cargo check --all-targets
      - name: Clippy using repository-declared lint levels
        run: cd source-main && cargo clippy --all-targets --all-features
      - run: cd source-main && cargo test --all-targets
