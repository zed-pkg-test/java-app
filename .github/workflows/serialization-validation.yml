name: serialization-validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  serialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit serialization source invariants
        run: python3 serialization-validation/scripts/audit.py
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build Oreslang compiler/runtime
        run: mvn -B -ntp -DskipTests package
      - name: Prove isolated channel ownership contract
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="--check serialization-validation/tests/channel_ownership_contract.ores"
      - name: Diagnose serialization units individually
        shell: bash
        run: |
          set -u
          failures=0
          while IFS= read -r file; do
            echo "==> CHECK $file"
            if ! mvn -B -ntp -DskipTests exec:java -Dexec.args="--check $file"; then
              failures=$((failures + 1))
              echo "::warning file=$file::per-unit check failed; imported signatures are currently opaque, so linked validation remains authoritative"
            fi
          done < <(find serialization-validation/src serialization-validation/tests -type f -name '*.ores' | sort)
          echo "per-unit diagnostic failures=$failures"
          exit 0
      - name: Run serialization and validation suite
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="serialization-validation/tests/main.ores"
