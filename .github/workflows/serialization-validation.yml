name: serialization-validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  serialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit serialization source invariants
        run: python3 serialization-validation/scripts/audit.py
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Build Oreslang compiler/runtime
        run: mvn -B -ntp -DskipTests package
      - name: Prove Future-composed channel streaming contract
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="--check serialization-validation/tests/channel_future_composition_contract.ores"
      - name: Record direct async-channel boundary diagnostic
        shell: bash
        run: |
          if mvn -B -ntp -DskipTests exec:java -Dexec.args="--check serialization-validation/tests/channel_ownership_contract.ores"; then
            echo "direct async Channel<T> parameters are now accepted; compiler issue #400 may be ready to close"
          else
            echo "::notice::current compiler still rejects Channel<T> async parameters; tracked in oreslang-source.java#400"
          fi
      - name: Run synchronous serialization core suite
        run: mvn -B -ntp -DskipTests exec:java -Dexec.args="serialization-validation/tests/core_main.ores"
      - name: Diagnose serialization units individually
        if: always()
        shell: bash
        run: |
          set -u
          failures=0
          while IFS= read -r file; do
            echo "==> CHECK $file"
            if ! mvn -B -ntp -DskipTests exec:java -Dexec.args="--check $file"; then
              failures=$((failures + 1))
              echo "::warning file=$file::per-unit check failed; imported signatures are currently opaque; see oreslang-source.java#400"
            fi
          done < <(find serialization-validation/src serialization-validation/tests -type f -name '*.ores' | sort)
          echo "per-unit diagnostic failures=$failures"
          exit 0
      - name: Record full async integration diagnostic
        if: always()
        shell: bash
        run: |
          if mvn -B -ntp -DskipTests exec:java -Dexec.args="serialization-validation/tests/main.ores"; then
            echo "full async serialization integration passed"
          else
            echo "::notice::full async integration remains diagnostic while compiler issue #400 is open"
          fi
