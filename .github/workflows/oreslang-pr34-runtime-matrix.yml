name: Oreslang PR34 JIT AOT hotload matrix
on:
  push:
    branches:
      - "feat/oreslang-mirror-pr34-*"
permissions:
  contents: read

jobs:
  jit-and-trusted-hotload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source tree
        run: |
          expected="$(cat ../SOURCE_TREE.txt)"
          actual="$(git rev-parse HEAD:oreslang-src)"
          test "$actual" = "$expected"
          printf 'source-head: '; cat ../SOURCE_HEAD.txt
          printf 'source-tree: %s\n' "$actual"
          java --version
          native-image --version
      - name: Full JVM JIT verification
        run: mvn -B -ntp verify
      - name: Trusted isolate hot-load regression
        run: mvn -B -ntp -Dtest=IsolationHotReloadTest test
      - name: Run core examples under JVM JIT
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"

  native-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source tree
        run: test "$(git rev-parse HEAD:oreslang-src)" = "$(cat ../SOURCE_TREE.txt)"
      - name: Build interpreter-only AOT image
        run: mvn -B -ntp -Pnative-aot -DskipTests package
      - name: Execute AOT guest
        run: ./target/ores-aot --mode=aot --platform=linux examples/together.ores

  native-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source tree
        run: test "$(git rev-parse HEAD:oreslang-src)" = "$(cat ../SOURCE_TREE.txt)"
      - name: Build AOT host with guest JIT
        run: mvn -B -ntp -Pnative-hybrid -DskipTests package
      - name: Execute hybrid guest
        run: ./target/ores-hybrid --mode=hybrid --platform=linux examples/together.ores

  native-isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: oreslang-src
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Verify exact source tree
        run: test "$(git rev-parse HEAD:oreslang-src)" = "$(cat ../SOURCE_TREE.txt)"
      - name: Build polyglot isolate library
        run: mvn -B -ntp -Pnative-isolate -DskipTests package
      - name: Locate isolate library
        id: isolate
        shell: bash
        run: |
          lib="$(find target -maxdepth 1 -type f \( -name 'oresvm.so' -o -name 'liboresvm.so' -o -name 'oresvm.dylib' -o -name 'liboresvm.dylib' \) | head -n1)"
          test -n "$lib"
          echo "path=$PWD/$lib" >> "$GITHUB_OUTPUT"
      - name: Execute strict trusted isolate
        run: mvn -B -ntp -Dpolyglot.engine.IsolateLibrary="${{ steps.isolate.outputs.path }}" -DskipTests exec:java -Dexec.args="--strict-isolate --mode=jit --platform=linux examples/together.ores"
