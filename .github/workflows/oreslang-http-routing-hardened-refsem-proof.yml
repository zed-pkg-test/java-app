name: oreslang-http-routing-hardened-refsem-proof

on:
  push:
    branches:
      - proof/oreslang-http-routing-hardened-refsem-f849-20261005

permissions:
  contents: read

jobs:
  route-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out self-contained proof tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify proof identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < proof245/COMPILER_SOURCE_REF)" = "f849ba4dd60bf0dda87030ef8a40c273a71e60ea"
          test "$(git rev-parse HEAD:proof245/routing)" = "b97d6b0d8576a233eb21a116ecb398eda946c91a"
          test "$(git hash-object proof245/routing/src/http_routing.ores)" = "e790f27aef4574b3454c7b936c893eff1b5996ce"

      - name: Install Java 21 and Maven
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openjdk-21-jdk maven

      - name: Compile reference-semantics compiler
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f proof245/compiler/pom.xml -DskipTests compile

      - name: Run router audit and golden runtime semantics
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          bash proof245/routing/scripts/audit.sh
          actual="$RUNNER_TEMP/router.actual"
          errors="$RUNNER_TEMP/router.err"
          set +e
          mvn -B -ntp -q -f proof245/compiler/pom.xml -DskipTests exec:java \
            -Dexec.args="$GITHUB_WORKSPACE/proof245/routing/tests/router_semantics.ores" \
            > "$actual" 2> "$errors"
          status=$?
          set -e
          if [[ -s "$actual" ]]; then
            echo "=== router stdout ==="
            cat "$actual"
          fi
          if [[ -s "$errors" ]]; then
            echo "=== router stderr ==="
            cat "$errors"
          fi
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          diff -u proof245/routing/tests/expected.txt "$actual"
