name: rx-callbacks pointerless validation

on:
  push:
    branches:
      - test/rx-callbacks-pr2-on-pr381-20261006

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify exact compiler base
        shell: bash
        run: |
          BASE=e9c74fa474bf464e99904d05508b69026ff40063
          test "$(git rev-parse "$BASE^{tree}")" = "e17024bc2afdb575049ff046a7390ee2093c2b4a" || {
            echo "::error::validation branch is not based on exact Oreslang #381 carrier tree"
            exit 1
          }
          unexpected="$(git diff --name-only "$BASE" HEAD -- .             ':(exclude)validation/rx-callbacks/**'             ':(exclude)src/test/java/dev/oreslang/RxCallbacksPointerlessValidationTest.java'             ':(exclude).github/workflows/rx-callbacks-pointerless.yml')"
          if [ -n "$unexpected" ]; then
            echo "::error::compiler files changed after exact #381 base"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Compile and execute pointerless callback library
        run: >
          mvn -B -ntp -Dores.runtime.carriers=java
          -Dtest=RxCallbacksPointerlessValidationTest
          test
