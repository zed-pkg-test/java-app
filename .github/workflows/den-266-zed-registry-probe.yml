name: DEN-266 Zed registry probe
on:
  pull_request:
    paths:
      - 'fixtures/DEN-266/**'
      - '.github/workflows/den-266-zed-registry-probe.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact current Zed CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-cli
          ref: 388161f681bac8ae704a22a593280ceed6cc4fa9
          persist-credentials: false
          path: zed-cli
      - name: Build exact current Zed CLI
        working-directory: zed-cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '388161f681bac8ae704a22a593280ceed6cc4fa9'
          cargo build --locked --release --bin zed
          printf 'ZED_BIN=%s\n' "$GITHUB_WORKSPACE/zed-cli/target/release/zed" >> "$GITHUB_ENV"
      - name: Resolve immutable rate-limit package without credentials
        working-directory: fixtures/DEN-266
        shell: bash
        run: |
          set -euo pipefail
          "$ZED_BIN" install --install-mode copy
          test -s .zpkg.lock
          "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json | tee "$RUNNER_TEMP/validate.json"
          grep -F 'ores-rate-limit/ores-rl-lib-core' .zpkg.lock
          grep -F 'version = "0.1.0"' .zpkg.lock
      - name: Upload resolver evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: den-266-zed-main-fallback-probe-${{ github.run_id }}
          path: |
            fixtures/DEN-266/.zpkg.lock
            ${{ runner.temp }}/validate.json
          if-no-files-found: warn
          retention-days: 7
