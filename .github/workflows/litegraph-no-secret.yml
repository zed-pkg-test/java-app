name: litegraph-no-secret-carrier

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: verify exact source trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:source)" = "d71dff3ddcb71ef5cf40b6ca464aefb5a8e142b0"
          test "$(git rev-parse HEAD:vendor/litegraph-gpu-host)" = "a99b312757206f463d75756bbe703968440c97b2"
          test "$(git rev-parse HEAD:vendor/litegraph-modeld)" = "04714b79813beba45942f52929f61d32279652b1"
          test "$(git rev-parse HEAD:vendor/litegraph-runtime)" = "b03d1c71faa2df734a3d0bf06349248111939304"
          grep -F 'rev = "9154bc3d3cbf62109fcd354256fd800b33198ebc"' source/Cargo.toml
          grep -F 'rev = "07dc685521cb1edaf36abea85491c7e9a2a00fb5"' source/Cargo.toml
          grep -F 'rev = "f16c6e95bcc66c84bcbb49a524ee3fbd7087fdcd"' source/Cargo.toml

      - name: toolchain
        run: rustc --version && cargo --version && rustfmt --version && cargo clippy --version

      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p litegraph-node --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test -p litegraph-node --all-features
