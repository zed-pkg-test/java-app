name: oreslang-pr35-validation

on:
  push:
    branches:
      - ci/oreslang-pr35
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Oreslang actor branch
        uses: actions/checkout@v4
        with:
          repository: ores-truffle-oreslang/oreslang-source.java
          ref: feat/akka-style-shared-actors

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Java diagnostics
        run: java --version

      - name: Verify compiler/runtime tests
        run: mvn -B -ntp verify

      - name: Run examples
        run: |
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/showcase.ores"
          mvn -B -ntp -DskipTests exec:java -Dexec.args="examples/together.ores"
