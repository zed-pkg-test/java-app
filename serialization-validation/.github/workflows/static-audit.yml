name: static-audit

on:
  push:
    branches:
      - main
      - 'harden/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Audit Oreslang source invariants
        run: python3 scripts/audit.py
