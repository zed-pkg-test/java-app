[package]
name = "zed-client-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser/worker WebAssembly SDK for the zed-pkg registry"
license = "MIT"
repository = "https://github.com/zed-pkg/zed-clients"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zed-interfaces = { path = "../../../zed-interfaces" }
hex = "0.4"
js-sys = "0.3"
percent-encoding = "2"
serde = "1"
serde_json = "1"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
url = "2.5"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "FormData",
  "Headers",
  "Request",
  "RequestInit",
  "RequestRedirect",
  "Response",
] }
