name = "zed_pkg_client"
version = "0.1.0"
description = "Gleam SDK for the zed-pkg registry."
licences = ["MIT"]
repository = { type = "github", user = "zed-pkg", repo = "zed-clients" }
target = "erlang"
gleam = ">= 1.14.0"

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
