[package]
name = "litegraph-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
async-trait = "0.1"
axum = "0.8"
litegraph-gpu-host = { path = "vendor/litegraph-gpu-host" }
litegraph-modeld = { path = "vendor/litegraph-modeld" }
litegraph-runtime = { path = "vendor/litegraph-runtime" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
