[workspace]
members = ["source"]
resolver = "2"

[patch."https://github.com/litegraph/litegraph-gpu-host"]
litegraph-gpu-host = { path = "vendor/litegraph-gpu-host" }

[patch."https://github.com/litegraph/litegraph-modeld"]
litegraph-modeld = { path = "vendor/litegraph-modeld" }

[patch."https://github.com/litegraph/litegraph-runtime"]
litegraph-runtime = { path = "vendor/litegraph-runtime" }
